<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My GitHub Pages Test</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #1a1a1a;
    }

    .card {
      background: #ffffff;
      border-radius: 16px;
      padding: 3rem 2.5rem;
      max-width: 480px;
      width: 90%;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
      text-align: center;
    }

    .badge {
      display: inline-block;
      background: #eef2ff;
      color: #4338ca;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      padding: 0.35rem 0.9rem;
      border-radius: 999px;
      margin-bottom: 1.25rem;
    }

    h1 {
      font-size: 1.8rem;
      margin-bottom: 0.75rem;
    }

    p {
      color: #555;
      line-height: 1.6;
      margin-bottom: 1.5rem;
    }

    .status {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      font-size: 0.95rem;
      font-weight: 500;
      color: #16a34a;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #16a34a;
      box-shadow: 0 0 0 4px rgba(22, 163, 74, 0.15);
    }

    #time {
      margin-top: 1.5rem;
      font-size: 0.8rem;
      color: #999;
    }

    footer {
      margin-top: 2rem;
      font-size: 0.75rem;
      color: #aaa;
    }
  </style>
</head>
<body>
  <div class="card">
    <span class="badge">Test Page</span>
    <h1>🎉 It's live!</h1>
    <p>If you can see this, your GitHub Pages site is up and running correctly.</p>
    <div class="status">
      <span class="dot"></span>
      <span>Site is working</span>
    </div>
    <div id="time"></div>
    <footer>Deployed via GitHub Pages</footer>
  </div>

  <script>
    document.getElementById('time').textContent =
      'Page loaded at ' + new Date().toLocaleString();
  </script>
</body>
</html>
